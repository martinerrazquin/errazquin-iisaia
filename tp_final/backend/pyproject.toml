[project]
name = "chismoso-backend"
version = "0.1.0"
description = "Chismoso one-time secret handoff API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
